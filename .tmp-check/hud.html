  <!-- ─── IN-MATCH HUD ─── -->
  <div class="hud" id="gameHud" style="display: none;">
    <div class="top-bar">
      <!-- YOU -->
      <div class="player-hud you" id="youPlate">
        <div class="fighter-top">
          <span class="fighter-sigil" id="youSigil">🔥</span>
          <span class="fighter-name" id="youHudName">YOU</span>
          <span class="fighter-hp" id="youHpVal">100</span>
        </div>
        <div class="meter-wrap"><div id="youHpFill" class="hp-fill"></div></div>
        <div class="meter-wrap mana-track" style="margin-top: 3px;">
          <div id="youManaFill" class="mana-fill"></div>
          <span class="mana-val" id="youManaVal">5.0 / 10</span>
        </div>

        <div class="windup-container" id="youWindupBox">
          <div class="windup-label" id="youWindupLabel">⚡ CHARGING...</div>
          <div class="windup-track"><div class="windup-bar" id="youWindupFill"></div></div>
        </div>

        <div id="youStatusTags" class="fighter-tags status-tags"></div>
      </div>

      <!-- ROUND CLOCK + MENU -->
      <div class="hud-center">
        <div class="clock" id="matchClock">00:00</div>
        <button id="btnDuelMenu" class="icon-btn" type="button" title="Duel menu (Esc)" aria-label="Duel menu">☰</button>
      </div>

      <!-- RIVAL -->
      <div class="player-hud opp" id="oppPlate">
        <div class="fighter-top">
          <span class="fighter-hp" id="oppHpVal">100</span>
          <span class="fighter-name" id="oppHudName">RIVAL</span>
          <span class="fighter-sigil" id="oppSigil">❄️</span>
        </div>
        <div class="meter-wrap"><div id="oppHpFill" class="hp-fill"></div></div>
        <div class="meter-wrap mana-track" style="margin-top: 3px;">
          <div id="oppManaFill" class="mana-fill" style="margin-left: auto;"></div>
          <span class="mana-val" id="oppManaVal">5.0 / 10</span>
        </div>

        <div class="windup-container" id="oppWindupBox">
          <div class="windup-label" id="oppWindupLabel" style="color: #f87171;">⚡ RIVAL CHARGING...</div>
          <div class="windup-track"><div class="windup-bar" id="oppWindupFill"></div></div>
        </div>

        <div id="oppStatusTags" class="fighter-tags status-tags"></div>
      </div>
    </div>

    <!-- Center alerts -->
    <div class="center-announcement">
      <div id="disconnectBanner">⚠️ Rival disconnected — forfeit in <span id="disconnectSec">30</span>s</div>
      <div id="spellFlash">EAT FLAMES!</div>
      <div id="centerMsg"></div>
    </div>

    <!-- Bottom dock -->
    <div class="bottom-bar">
      <div class="combat-left interactive">
        <div class="voice-strip">
          <button id="btnVoiceToggle" class="hud-btn" type="button">
            <span id="micIcon">🎤</span> <span id="micStatusText">VOICE OFF</span>
          </button>
          <select id="hudVoiceLangSelect" class="voice-lang-select" title="Recognition accent">
            <option value="en-IN">IN</option>
            <option value="en-US">US</option>
            <option value="en-GB">UK</option>
            <option value="en-AU">AU</option>
          </select>
          <button id="btnHudVoiceTest" class="voice-test-btn" type="button" title="Check microphone and speech recognition">MIC</button>
          <button id="btnHudMute" class="voice-test-btn" type="button" title="Toggle sound effects">🔊</button>
          <button id="btnTypeCast" class="voice-test-btn" type="button" title="Type an incantation instead of speaking it">⌨ TYPE</button>
          <div class="heard-chip" id="heardDisplay" aria-live="polite">Say or tap a spell — keys 1–4 and Space also work.</div>
        </div>
        <form id="typeCastForm" class="type-cast" hidden>
          <input id="typeCastInput" class="arc-input" maxlength="60" autocomplete="off" placeholder="Type an incantation, then Enter…" aria-label="Typed incantation" />
          <button class="voice-test-btn" type="submit">CAST</button>
        </form>
        <div class="combat-hints">
          <span><kbd class="key">WASD</kbd> MOVE</span>
          <span><kbd class="key">RMB</kbd> AIM</span>
          <span id="netPill">KEYS · VOICE · TAP</span>
        </div>
      </div>

      <div class="spell-grid-hud spell-dock interactive" id="spellButtonsContainer">
        <!-- Built from the chosen class kit -->
      </div>
    </div>
  </div>

  <!-- ─── MATCH INTRO ─── -->
  <div id="matchIntro" aria-hidden="true">
    <div class="mi-fighter" id="introMe">
      <span class="mi-glyph">🔥</span>
      <span class="mi-name">YOU</span>
      <span class="mi-class">FIRE MAGE</span>
    </div>
    <div class="mi-vs">VS</div>
    <div class="mi-fighter" id="introOpp">
      <span class="mi-glyph">❄️</span>
      <span class="mi-name">RIVAL</span>
      <span class="mi-class">FROST MAGE</span>
    </div>
  </div>
